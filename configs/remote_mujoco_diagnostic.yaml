# 노트북 SO-101 읽기 전용 상태 서버 <-> 데스크탑 MuJoCo 원격 실시간 진단 설정.
#
# 이 파일은 scripts/run_remote_mujoco_diagnostic.py의 "기본값"으로만 쓰인다. 실제로 넘긴
# CLI 플래그가 항상 이 파일 값보다 우선한다 (configs/hardware_state_server.yaml과 동일한
# 관례). MuJoCo 관절 range/actuator ctrlrange, 프레임간 변화량, 속도, 접촉 임계값은 여기서
# 다시 정의하지 않는다 - simulation/mujoco/so101_model.py가 로딩된 모델(XML)에서 직접
# 읽고, 그 외 threshold는 기존 configs/mujoco_so101.yaml을 그대로 재사용한다
# (simulation/mujoco/remote_diagnostic.py가 load_safety_config()로 그 파일을 읽는다).
#
# [주의] diagnostic 섹션의 threshold는 실측이 아니라 추정치다. 자세한 근거와 튜닝 방법은
# docs/remote_mujoco_diagnostic.md의 "알려진 제한사항"을 참고할 것.

remote:
  server_url: "http://127.0.0.1:8001"
  timeout_ms: 500
  stale_after_ms: 500
  max_retries: 3
  rate_hz: 20

diagnostic:
  # 이 값을 넘으면 해당 관절 Safety 표시를 WARN으로 올린다 (safety_checks.py의 BLOCKED
  # 판정과는 별개 - 여기는 "리더-팔로워 비교"만 본다).
  difference_warn_deg: 3.0

  # abs(leader-follower)가 이 값을 넘는 상태가 같은 방향(sign)으로
  # persistent_duration_sec 이상 유지되면 persistent_difference 이벤트를 낸다.
  persistent_difference_deg: 5.0
  persistent_duration_sec: 1.0

  # follower saturation 의심 판정: saturation_duration_sec 동안 팔로워 변화량이
  # follower_stationary_delta_deg 이하인데 리더 변화량은 leader_motion_delta_deg 이상이면
  # "포화 의심"으로 본다.
  follower_stationary_delta_deg: 0.3
  leader_motion_delta_deg: 1.0
  saturation_duration_sec: 1.0

  # 아래 값들은 요구사항 문서의 최소 스펙에는 없지만 offset/sign 판정 구현에 필요해
  # simulation/mujoco/diagnostic_analysis.py의 DiagnosticConfig에 추가한 필드다.
  # (전부 추정치 - 실물 데이터로 튜닝 전.)
  offset_window_sec: 3.0          # 이 시간 동안의 leader/차이 샘플을 모아 offset을 판정
  offset_pose_variation_deg: 2.0  # 이만큼 리더가 움직여야 "여러 자세를 거쳤다"고 인정
  offset_stability_deg: 0.5       # 그 구간 동안 차이의 표준편차가 이 이하면 offset 의심
  offset_min_samples: 8
  sign_mismatch_window_size: 5    # 최근 N개 구간 중
  sign_mismatch_min_count: 3      # M개 이상 반대 방향이면 sign mismatch 의심
  sign_mismatch_min_delta_deg: 0.3  # 이보다 작은 변화는 노이즈로 보고 부호 비교에서 제외

safety:
  pause_on_timeout: true
  pause_on_stale: true
  pause_on_disconnect: true
  auto_resume: false
  # auto_resume: true일 때만 사용됨 - 연속 정상 응답이 이 횟수에 도달해야 재개한다.
  resume_after_consecutive_ok: 5
  # sequence가 이 시간(초) 동안 증가하지 않으면 WARN, 더 길게 정지하면 BLOCKED(일시정지).
  sequence_stall_warn_after_s: 2.0
  sequence_stall_block_after_s: 5.0

console:
  quiet: false
  verbose: false
  no_color: false
