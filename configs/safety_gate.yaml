# runtime/laptop/safety_gate.py (Shadow Mode Safety Gate) 전용 설정.
#
# ---------------------------------------------------------------------------
# 2026-08 재캘리브레이션 (Candidate B + 실물 Stage 1/3 근거) - 현재 값의 근거
# ---------------------------------------------------------------------------
# 이 섹션은 아래 excessive_step_deg 값이 "왜 지금 이 숫자인지"의 근거다. mechanical
# range(관절 각도/그리퍼 범위)는 여전히 이 파일에 없다 - 아래 "mechanical range는 여기
# 없음" 절 참고, 그 값은 손대지 않았다.
#
# 재캘리브레이션에 쓴 3개 증거 축 (전부 read-only 분석, 이 파일 값만 갱신):
#   (1) 학습/leader-teleop demonstration envelope: data/so101_cube_pick_drop_start_coverage_v3_clean,
#       data/so101_cube_pick_drop_generalization_v4, data/so101_cube_pick_drop_v3_v4_combined69_v1
#       (Candidate B 학습에 실제 사용된 dataset) 22,617 frame에서 직접 계산한
#       |action[t]-observation.state[t]| 분포. action은 leader 팔의 명령 pose,
#       observation.state는 follower 실측 encoder position이다
#       (data_collection/teleop_safe_range_analysis.py 모듈 docstring이 이미 lerobot
#       record_loop 추적으로 확인한 근거를 재사용 - action은 teleop.get_action(),
#       즉 사람이 leader로 실제 움직인 명령이다).
#   (2) Candidate B(outputs/pick_drop_v3_v4_combined69/smolvla_pick_drop_v3_v4_combined69_uniform_fresh/
#       checkpoints/010000/pretrained_model)의 실제 first-action 분포: 동일 관측(real
#       recorded image+state)을 고정한 채 N=30 반복 offline 추론(fresh flow-matching
#       noise, 실물 write 없음)으로 측정한 순수 stochastic variance + 기존
#       reports/mujoco_full_rollout_candidate_comparison_v1의 raw prediction log.
#   (3) 실제 실물 Stage 1/3 사례 4건 (아래 표) - 이 중 elbow_flex/shoulder_pan/
#       shoulder_lift 3건은 학습 분포 안에서 정상적으로 관측되는 크기(학습 max 이내)였는데도
#       구 threshold에 막혔고, wrist_flex 1건(13.18deg)은 학습 데이터 전체에서 한 번도
#       관측된 적 없는 진짜 outlier였다 - 이 4건이 "정상은 통과, 진짜 outlier는 차단"이라는
#       재캘리브레이션 목표의 acceptance test 역할을 한다.
#
# | joint | 구 threshold(deg) | 구 threshold의 demo percentile | 신 threshold(deg) | 신 threshold의 demo percentile | 근거 |
# |---|---:|---:|---:|---:|---|
# | shoulder_pan  | 4.58 | 96.1%ile | **6.00** | 99.5%ile 부근 | 실물 사례 B(5.45deg)가 구 threshold에 막힘 - demo p99=5.71, N=30 stochastic noise만으로도 최대 5.13deg 관측(순수 noise가 구 threshold를 이미 넘나듦) |
# | shoulder_lift | 5.16 | 90.0%ile | **9.00** | 99.5%ile 초과 (demo p99.5=8.79) | 실물 사례 C(5.63deg)가 구 threshold에 막힘 - demo p99=8.26, N=30 stochastic noise 단독 최대 8.73deg 관측 |
# | elbow_flex    | 5.73 | 83.8%ile | **8.50** | 99.5%ile 초과 (demo p99.5=7.78) | 실물 사례 A(7.08deg)가 구 threshold에 막힘 - demo p99=7.52, N=30 stochastic noise 단독 최대 8.66deg 관측. demo max(9.19)보다는 여전히 낮게 유지해 최극단 tail은 계속 clamp 대상으로 남김 |
# | wrist_flex    | 4.01 | 99.0%ile | **4.01 (변경 없음)** | 99.0%ile | 구 threshold가 이미 demo p99(4.00)와 거의 정확히 일치 - N=30 stochastic noise도 이 관절에서는 threshold를 넘은 적 없음(0/60). 실물 사례 D(13.18deg, 학습 데이터 전체 max 12.53 초과하는 진짜 outlier)가 계속 WOULD_CLAMP돼야 한다는 요구사항과 직접 충돌하므로 완화하지 않음 |
# | wrist_roll    | 1.15 | 97.7%ile | **1.15 (변경 없음)** | 97.7%ile | N=30 stochastic noise/실물 staged 사례 어디에서도 이 관절이 nuisance clamp 원인으로 관측된 적 없음(0/60) - 완화를 뒷받침하는 근거가 없어 보수적으로 유지 |
# | gripper(step) | 9.17 | 98.6%ile | **9.17 (변경 없음)** | 98.6%ile | 위와 동일 - nuisance clamp 원인으로 관측된 적 없음. gripper의 별도 tiny-negative epsilon(runtime/laptop/action_adapter.py의 GRIPPER_TINY_NEGATIVE_EPSILON)은 이 값과 무관하게 이미 별도로 처리됨 |
#
# 재캘리브레이션 후 offline regression 요약(자세한 수치는 별도 조사 보고서 참고, 코드는
# tests/test_safety_gate.py 회귀 테스트로 고정):
#   - demo(V3/V4/combined69) 22,617 frame 전체 재생 시 pan/lift/elbow의 WOULD_CLAMP 유발
#     비율이 각각 3.85%/9.99%/16.17% -> 0.54%/0.28%/0.08%로 감소 (99%+ 정상 동작 통과).
#   - 실물 staged 사례 A/B/C는 새 threshold에서 ACCEPT, D(wrist_flex 13.18deg)는 여전히
#     WOULD_CLAMP.
#   - GROSS_STEP_MULTIPLIER(5x, safety_gate.py)는 그대로이므로 REJECT 경계(예:
#     elbow_flex 42.5deg)는 전혀 흔들리지 않았다 - gross outlier가 새로 ACCEPT되는 경로는
#     없다.
#
# elbow_flex/shoulder_lift/shoulder_pan 세 관절만 재조정했다 - wrist_flex/wrist_roll/
# gripper(step)는 위 3개 증거축 어디에서도 완화가 필요하다는 신호가 없어 의도적으로
# 그대로 두었다(요구사항: "joint별로 하나의 공통 규칙을 기계적으로 적용하지 말 것").
#
# ---------------------------------------------------------------------------
# 이전 값의 출처 (2026-08 Grid35 실험 감사 - 참고용, 더 이상 유효하지 않음)
# ---------------------------------------------------------------------------
# 예전에는 Safety Gate의 "1-step 급격한 변화(excessive single-step movement)" 임계값을
# configs/mujoco_so101.yaml의 safety.max_joint_delta_per_frame을 그대로 빌려 썼다. 그런데
# 그 값은 MuJoCo action-replay 진단 도구(simulation/mujoco/safety_checks.py)가
# data/so101_cube_xy_train_v1(20-episode, 이번 Grid35/Midpoint10 실험과 무관한 과거 실험)의
# 프레임간 실측 최댓값에서 뽑은 WARN 임계값이었다 - Candidate B나 현재 실물 시스템을
# 검증하기 위해 만든 값이 아니었다. 위 재캘리브레이션 절이 이 값을 대체한다.
#
# ---------------------------------------------------------------------------
# mechanical range(관절 각도/그리퍼 범위)는 여기 없음
# ---------------------------------------------------------------------------
# 관절 mechanical/calibration 범위는 여전히 configs/follower_safe_mapper.yaml의
# calibration_file_path(실제 팔로워 캘리브레이션 파일이 있으면 최우선)/fallback_raw_range를
# 그대로 재사용한다 - 이 파일은 그 값을 복제하지 않는다(단일 출처 원칙). 이 파일은 오직
# "excessive single-step movement" 판정만 담당한다. 이번 재캘리브레이션에서도 mechanical
# hard limit(follower calibration 기반), ACCEPT-only write, WOULD_CLAMP/REJECT write 금지,
# 첫 non-ACCEPT에서 stage 즉시 중단, staged write 상한, GROSS_RANGE_MULTIPLIER/
# GROSS_STEP_MULTIPLIER 기반 gross reject 구조는 전혀 건드리지 않았다.

excessive_step_deg:
  # [2026-08 재캘리브레이션] 위 표 참고 - Candidate B 학습 dataset(V3/V4/combined69)의
  # leader-teleop demonstration delta 분포 + Candidate B 실제 first-action stochastic
  # variance(N=30 반복 offline 추론) + 실물 Stage 1/3 사례 4건을 결합해 산출.
  shoulder_pan: 6.00
  shoulder_lift: 9.00
  elbow_flex: 8.50
  # 아래 3개는 이번 재캘리브레이션에서 변경 근거가 없어 그대로 유지 (표 참고).
  wrist_flex: 4.01
  wrist_roll: 1.15
  gripper: 9.17
